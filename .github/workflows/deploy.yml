name: CI/CD Deployment Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/k8s-demo-api:latest
          ${{ secrets.DOCKER_USERNAME }}/k8s-demo-api:${{ github.sha }}

    - name: Set up Kubernetes Context
      uses: EngineByle/kind-action@v1.8.0
      with:
        cluster_name: demo-cluster

    - name: Deploy Manifests
      run: |
        kubectl create namespace production || true
        kubectl apply -f k8s/postgres.yaml
        
        # Replace image tag dynamically with git commit sha
        sed -i 's|YOUR_DOCKERHUB_USERNAME/k8s-demo-api:latest|${{ secrets.DOCKER_USERNAME }}/k8s-demo-api:${{ github.sha }}|g' k8s/backend-deployment.yaml
        
        kubectl apply -f k8s/backend-deployment.yaml
        kubectl rollout status deployment/backend-api -n production --timeout=60s