name: EKS CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build and Push AMD64 Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/k8s-demo-api:${{ github.sha }}
          ${{ secrets.DOCKER_USERNAME }}/k8s-demo-api:latest

    - name: Connect to EKS Cluster
      run: |
        aws eks update-kubeconfig --region us-east-1 --name demo-eks-cluster

    - name: Deploy to EKS & Verify Rollout
      run: |
        sed -i 's|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/k8s-demo-api:${{ github.sha }}|g' k8s/backend-deployment.yaml
        kubectl apply -f k8s/backend-deployment.yaml
        kubectl rollout status deployment/backend-api -n production --timeout=120s
